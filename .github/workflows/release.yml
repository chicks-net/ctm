name: Release

on:
  push:
    tags:
      - 'v*'

# global permissions
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # no caching in a publishing workflow: cache poisoning could
          # tamper with future builds (zizmor cache-poisoning)
          cache: false

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58'

      - name: Build cross-platform binaries
        run: just release-build

      - name: Generate build attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ github.workspace }}/dist/*"

      - name: Generate subject hashes for SLSA provenance
        id: hash
        run: |
          hashes=$(just release-hashes)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binaries with cosign (keyless)
        run: just release-sign

      - name: Upload binaries and signatures (gh release upload)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          just release-upload "$TAG"
          just release-notes "$TAG"

  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA generator requires a tag ref (refs/tags/vX.Y.Z) for its internal builder checkout;
    # pinning to a git SHA causes "Invalid ref" errors and provenance generation failure.
    # See: https://github.com/fini-net/gh-observer/actions/runs/27281001944
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
