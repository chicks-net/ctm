---
name: Go CI

on:
  push:
    branches:
      - main
  pull_request:

# global permissions
permissions: {}

jobs:
  go-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      # publishes the coverage report that the README badge and awesome-go's
      # submission requirements link to; requires the CODECOV_TOKEN secret
      # because codecov no longer supports tokenless uploads from CI pushes
      - name: Upload coverage to Codecov
        # plain pull_request triggers don't inject secrets into fork PRs, so
        # the upload can't authenticate there - skip the doomed attempt;
        # same-repo PRs (incl. Renovate branches) and pushes to main still run
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
